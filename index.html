<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="estilos/style.css" media="all">
    <link rel="stylesheet" href="estilos/retrato.css" media="screen and (orientation: portrait)">
    <link rel="stylesheet" href="estilos/paisagem.css" media="screen and (orientation: landscape)">
    <link rel="stylesheet" href="estilos/impressora.css" media="print">
    <title>Desafio Card de Perfil Responsivo</title>
</head>
<body>

    <main>

        <div id="container">

            <h1 id="h1">Login - <strong>Ecoviva</strong></h1>

            <div id="contfoto">

                <img src="imagens/logo-ecoviva.png" alt="Logo ecoviva">

            </div>

            <form action="cadastro.js" method="get">

                <div class="posi">

                    <label for="iemail">Email: </label>

                    <input type="text" name="email" id="iemail" placeholder="Digite seu Email" required class="imput">

                </div class="posi">

                <div class="posi">

                    <label for="isenha">Senha: </label>

                    <input type="password" name="senha" id="isenha" placeholder="Digite sua Senha" required class="imput" style="margin-bottom: 50px;">

                    <p id="esqueceu">
                        
                        <a href="https://www.google.com/search?client=opera-gx&q=se+lascou&sourceid=opera&ie=UTF-8&oe=UTF-8" target="_blank" rel="external">Esqueceu sua senha?</a>
                    
                    </p>

                </div>

                <div id="inputenv">

                    <input type="submit" value="Entrar"> 
                    
                    <hr>

                    <p id="criar">Não tem conta? <a href="https://www.google.com/search?client=opera-gx&q=nao+vai+criar+nao&sourceid=opera&ie=UTF-8&oe=UTF-8" target="_blank" rel="external"><strong>Crie uma aqui</strong></a></p>
            
                </div>

            </form>  

        </div>

    </main>

</body>
</html>
